name: Release Baro

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v prefix, e.g. 1.4.2)'
        required: false
        default: '1.4.2'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test, and Release (Apple Silicon)
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Toolchain info
        run: |
          sw_vers
          swift --version

      - name: Run unit tests
        run: swift test

      - name: Static read-only audit
        run: |
          if grep -rnE "kill\(|kSMCWriteKey|removeItem|unlink\(|AuthorizationExecuteWithPrivileges|powermetrics" Sources/; then
            echo "Intrusive API detected!" >&2
            exit 1
          fi
          echo "Static read-only audit passed."

      - name: Determine and validate version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="${INPUT_VERSION:-1.4.2}"
            TAG="v${VERSION}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer version: $VERSION" >&2
            exit 1
          fi
          if [[ "$TAG" != "v${VERSION}" ]]; then
            echo "Tag '$TAG' does not match expected 'v${VERSION}'" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Baro.app and zip package
        env:
          BARO_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          chmod +x scripts/build_app.sh scripts/generate_icon.py
          ./scripts/build_app.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ZIP_FILE="dist/Baro-v${RELEASE_VERSION}-macOS-arm64.zip"
          SHA_FILE="${ZIP_FILE}.sha256"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ZIP_FILE" "$SHA_FILE"
          else
            gh release create "$RELEASE_TAG" "$ZIP_FILE" "$SHA_FILE" \
              --title "Baro ${RELEASE_TAG}" \
              --generate-notes
          fi
